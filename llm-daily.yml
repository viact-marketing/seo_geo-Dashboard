name: Daily AI answer check

on:
  schedule:
    - cron: "40 1 * * *"   # 07:10 IST every day (before the 07:47 audit)
  workflow_dispatch:
    inputs:
      mode:
        description: "today = today's ~19 questions, A-E = one group, all = all 93 (costs more)"
        required: false
        default: "today"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask the AI engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          PERPLEXITY_MODEL: ${{ vars.PERPLEXITY_MODEL }}
          LLM_MODE: ${{ github.event.inputs.mode || 'today' }}
        run: python seo-llm/llm_check.py
      - name: Save results to the repo
        run: |
          git config user.name "llm-bot"
          git config user.email "llm-bot@users.noreply.github.com"
          git add seo-llm/data
          git diff --cached --quiet || git commit -m "AI answer check $(date -u +%F)"
          git pull --rebase --autostash
          git push
